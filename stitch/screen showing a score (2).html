<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WordMaster - Game Summary</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- BEGIN: Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neonGreen: '#39FF14',
            vibrantOrange: '#FF4D00',
            mutedCyan: '#00A8A8',
            deepSpace: '#0B0E14',
            cyberBlue: '#1FB6FF',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'neon': '0 0 15px rgba(57, 255, 20, 0.4)',
            'orange-glow': '0 4px 20px rgba(255, 77, 0, 0.4)',
          }
        }
      }
    }
  </script>
<!-- END: Tailwind Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="animations">
    @keyframes pulse-neon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    .animate-pulse-neon {
      animation: pulse-neon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .glass-morphism {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
<style data-purpose="typography">
    .text-glow {
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.8), 0 0 20px rgba(57, 255, 20, 0.4);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-deepSpace text-white min-h-screen font-sans selection:bg-neonGreen selection:text-black">
<!-- BEGIN: Main Container -->
<main class="max-w-md mx-auto min-h-screen flex flex-col p-6 space-y-8" data-purpose="main-layout">
<!-- BEGIN: Header Section -->
<header class="text-center pt-8" data-purpose="summary-header">
<h1 class="text-cyberBlue text-sm font-mono tracking-[0.2em] uppercase mb-2">Mission Complete</h1>
<p class="text-gray-400 text-sm">Great effort, WordMaster! You're leveling up.</p>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Score Display -->
<section class="flex flex-col items-center justify-center py-6" data-purpose="score-display">
<div class="relative flex items-center justify-center">
<!-- Decorative Ring -->
<div class="absolute w-48 h-48 rounded-full border-2 border-neonGreen opacity-20 animate-ping"></div>
<div class="absolute w-40 h-40 rounded-full border border-neonGreen opacity-40"></div>
<!-- Score -->
<div class="text-center z-10">
<span class="block text-6xl font-black text-neonGreen text-glow animate-pulse-neon">85</span>
<span class="block text-neonGreen font-mono text-xl opacity-80 mt-1">/ 100</span>
</div>
</div>
<p class="mt-8 text-xl font-bold italic tracking-tight text-white">"PHENOMENAL VOCABULARY!"</p>
</section>
<!-- END: Score Display -->
<!-- BEGIN: Mistakes List -->
<section class="flex-grow space-y-4" data-purpose="review-section">
<h2 class="text-xs font-mono text-gray-500 uppercase tracking-widest px-1">Review your trajectory</h2>
<div class="space-y-3 max-h-64 overflow-y-auto pr-2 custom-scrollbar" id="mistakes-list">
<!-- Mistake Card 1 -->
<div class="glass-morphism rounded-xl p-4 flex justify-between items-center transition-all hover:border-white/20">
<div class="space-y-1">
<p class="text-xs text-gray-500 uppercase font-bold">You entered</p>
<p class="text-red-400 line-through font-medium">Equanimity</p>
</div>
<div class="h-8 w-px bg-white/10 mx-4"></div>
<div class="space-y-1 text-right">
<p class="text-xs text-gray-500 uppercase font-bold">Correction</p>
<p class="text-neonGreen font-bold">Ephemeral</p>
</div>
</div>
<!-- Mistake Card 2 -->
<div class="glass-morphism rounded-xl p-4 flex justify-between items-center transition-all hover:border-white/20">
<div class="space-y-1">
<p class="text-xs text-gray-500 uppercase font-bold">You entered</p>
<p class="text-red-400 line-through font-medium">Ubiquitous</p>
</div>
<div class="h-8 w-px bg-white/10 mx-4"></div>
<div class="space-y-1 text-right">
<p class="text-xs text-gray-500 uppercase font-bold">Correction</p>
<p class="text-neonGreen font-bold">Utopian</p>
</div>
</div>
<!-- Mistake Card 3 -->
<div class="glass-morphism rounded-xl p-4 flex justify-between items-center transition-all hover:border-white/20">
<div class="space-y-1">
<p class="text-xs text-gray-500 uppercase font-bold">You entered</p>
<p class="text-red-400 line-through font-medium">Loquacious</p>
</div>
<div class="h-8 w-px bg-white/10 mx-4"></div>
<div class="space-y-1 text-right">
<p class="text-xs text-gray-500 uppercase font-bold">Correction</p>
<p class="text-neonGreen font-bold">Luminous</p>
</div>
</div>
</div>
</section>
<!-- END: Mistakes List -->
<!-- BEGIN: Action Buttons -->
<footer class="space-y-4 pb-8" data-purpose="navigation-actions">
<!-- Play Again Button -->
<button class="w-full bg-vibrantOrange hover:bg-orange-600 text-white font-black py-4 rounded-2xl shadow-orange-glow transition-transform active:scale-95 flex items-center justify-center space-x-2">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="tracking-wider uppercase">Restart Protocol</span>
</button>
<!-- Finish Button -->
<button class="w-full bg-transparent border-2 border-mutedCyan/40 hover:border-mutedCyan text-mutedCyan font-bold py-4 rounded-2xl transition-all active:bg-mutedCyan/10">
<span class="tracking-widest uppercase text-sm">Exit to Terminal</span>
</button>
</footer>
<!-- END: Action Buttons -->
</main>
<!-- END: Main Container -->
</body></html>
