<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>WordMaster - Neon Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Poppins:wght@600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Neon Theme -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            poppins: ['Poppins', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            neonPurple: '#bc13fe',
            neonCyan: '#05ffa1',
            darkBg: '#0b0e14',
          },
          boxShadow: {
            'neon-purple': '0 0 10px #bc13fe, 0 0 20px #bc13fe',
            'neon-cyan': '0 0 10px #05ffa1, 0 0 20px #05ffa1',
          }
        }
      }
    }
  </script>
<!-- BEGIN: Custom Styles -->
<style data-purpose="neon-effects">
    .neon-border-purple {
      border: 2px solid #bc13fe;
      box-shadow: 0 0 8px #bc13fe;
    }
    .neon-border-cyan {
      border: 2px solid #05ffa1;
      box-shadow: 0 0 8px #05ffa1;
    }
    .text-glow-purple {
      text-shadow: 0 0 8px #bc13fe;
    }
    .text-glow-cyan {
      text-shadow: 0 0 8px #05ffa1;
    }
    /* Animated background gradient */
    .bg-animate {
      background: radial-gradient(circle at top right, #1a0b2e, #0b0e14 60%);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="bg-darkBg text-white font-inter min-h-screen flex items-center justify-center p-4 bg-animate">
<!-- BEGIN: Registration Container -->
<main class="w-full max-w-lg bg-black/60 backdrop-blur-2xl rounded-3xl p-6 sm:p-8 border border-neonCyan/30 shadow-2xl my-8 relative" data-purpose="login-card">
<!-- BEGIN: Header Section -->
<header class="text-center mb-6">
<h1 class="font-poppins text-4xl font-extrabold uppercase tracking-widest text-glow-purple italic text-neonPurple mb-2">
        WordMaster
      </h1>
<p class="text-slate-400 text-sm tracking-wide uppercase">Enter the Digital Arena</p>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Form Section -->
<form action="#" class="space-y-4" data-purpose="registration-form"><!-- Username & Full Name Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <!-- Username -->
  <div class="space-y-1.5">
    <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-username">Username</label>
    <div class="relative">
      <input class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 placeholder:text-slate-600 font-medium tracking-wide" id="reg-username" placeholder="e.g. cyber_learner" required="" type="text">
      <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
  </div>
  <!-- Full Name -->
  <div class="space-y-1.5">
    <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-fullname">Full Name</label>
    <div class="relative">
      <input class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 placeholder:text-slate-600 font-medium" id="reg-fullname" placeholder="John Doe" required="" type="text">
      <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
  </div>
</div>

<!-- Password -->
<div class="space-y-1.5">
  <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-password">Password</label>
  <div class="relative">
    <input class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 placeholder:text-slate-600 font-medium tracking-widest pr-11" id="reg-password" placeholder="••••••••" required="" type="password">
    <button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-neonCyan transition-colors focus:outline-none" onclick="const el = document.getElementById('reg-password'); el.type = el.type === 'password' ? 'text' : 'password';" type="button">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    </button>
  </div>
</div>

<!-- ID Number & Phone Number Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <!-- ID Number -->
  <div class="space-y-1.5">
    <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-idnum">ID Number</label>
    <div class="relative">
      <input class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 placeholder:text-slate-600 font-medium" id="reg-idnum" placeholder="9-digit ID" required="" type="text">
      <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
  </div>
  <!-- Phone Number -->
  <div class="space-y-1.5">
    <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-phone">Phone Number</label>
    <div class="relative">
      <input class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 placeholder:text-slate-600 font-medium" id="reg-phone" placeholder="+972 50-000-0000" required="" type="tel">
      <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
  </div>
</div>

<!-- Age & Referral Source Row -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
  <!-- Age -->
  <div class="space-y-1.5">
    <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-age">Age</label>
    <div class="relative">
      <input class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 placeholder:text-slate-600 font-medium" id="reg-age" placeholder="e.g. 15" required="" type="number">
      <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
  </div>
  <!-- Referral Source -->
  <div class="space-y-1.5">
    <label class="block text-xs font-semibold uppercase tracking-wider text-neonCyan ml-1" for="reg-referral">How did you hear about us?</label>
    <div class="relative">
      <select class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-neonCyan focus:ring-1 focus:ring-neonCyan outline-none transition-all duration-300 font-medium cursor-pointer appearance-none pr-10" id="reg-referral" required="">
        <option class="bg-slate-900 text-slate-400" disabled="" selected="" value="">Select an option</option>
        <option class="bg-slate-900 text-white" value="school">School / Teacher</option>
        <option class="bg-slate-900 text-white" value="social">Social Media</option>
        <option class="bg-slate-900 text-white" value="friend">Friend Recommendation</option>
        <option class="bg-slate-900 text-white" value="google">Google Search</option>
        <option class="bg-slate-900 text-white" value="other">Other</option>
      </select>
      <div class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
      </div>
    </div>
  </div>
</div>

<!-- Select Band Level -->
<div class="space-y-2 pt-1">
  <div class="flex items-center justify-between ml-1">
    <label class="text-xs font-semibold uppercase tracking-widest text-neonCyan">Select Band Level</label>
    <span class="text-[11px] text-slate-400 uppercase tracking-wider">Proficiency</span>
  </div>
  <div class="grid grid-cols-3 gap-3">
    <label class="relative cursor-pointer">
      <input checked="" class="peer sr-only" name="band" type="radio" value="1">
      <div class="bg-white/5 border border-slate-700 rounded-xl py-2.5 text-center transition-all peer-checked:border-neonPurple peer-checked:bg-neonPurple/20 peer-checked:shadow-neon-purple font-bold text-sm">
        B1
      </div>
    </label>
    <label class="relative cursor-pointer">
      <input class="peer sr-only" name="band" type="radio" value="2">
      <div class="bg-white/5 border border-slate-700 rounded-xl py-2.5 text-center transition-all peer-checked:border-neonPurple peer-checked:bg-neonPurple/20 peer-checked:shadow-neon-purple font-bold text-sm">
        B2
      </div>
    </label>
    <label class="relative cursor-pointer">
      <input class="peer sr-only" name="band" type="radio" value="3">
      <div class="bg-white/5 border border-slate-700 rounded-xl py-2.5 text-center transition-all peer-checked:border-neonPurple peer-checked:bg-neonPurple/20 peer-checked:shadow-neon-purple font-bold text-sm">
        B3
      </div>
    </label>
  </div>
</div>

<!-- Submit Button -->
<button class="w-full bg-neonCyan/10 border-2 border-neonCyan text-neonCyan font-poppins font-bold text-base py-3.5 rounded-xl hover:bg-neonCyan hover:text-black transition-all duration-300 shadow-neon-cyan uppercase tracking-[0.2em] mt-3 active:scale-95 flex items-center justify-center gap-2" data-purpose="start-game-button" type="submit">
  <span class="">Create Account / Start</span>
  <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 7l5 5m0 0l-5 5m5-5H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button></form>
<!-- END: Form Section -->
<!-- Footer Decoration -->
<footer class="mt-8 flex justify-center space-x-2">
<div class="h-1 w-8 bg-neonPurple rounded-full opacity-50"></div>
<div class="h-1 w-16 bg-neonCyan rounded-full"></div>
<div class="h-1 w-8 bg-neonPurple rounded-full opacity-50"></div>
</footer>
</main>
<!-- END: Registration Container -->


</body></html>
